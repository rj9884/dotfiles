# hypridle - omarchy-style idle cycle
#
# Mirrors omarchy's default idle service timings:
#   idle 150s -> launch fullscreen screensaver
#   idle 300s -> lock the screen (screensaver keeps running underneath)
#   idle 360s -> turn the display off (DPMS) to save power
#
# The screensaver dismisses itself on a keypress or on losing focus, exactly
# like omarchy's, so there is no on-resume kill here: hypridle treats the
# screensaver's own fullscreen launch as activity, and killing on resume would
# kill it the moment it opens. The launch guard below makes a re-armed listener
# a no-op instead of stacking a second screensaver.

# Mirrors omarchy's lock/sleep handling: lock on lock-session requests, lock
# before the machine suspends, and wake the display after sleep/idle resume.
# inhibit_sleep = 3 makes the session lock secure before logind proceeds.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = sleep 1 && hyprctl dispatch dpms on
    inhibit_sleep = 3
}

listener {
    timeout = 150
    on-timeout = hyprctl clients -j | jq -e 'any(.[]; .class == "arch-screensaver")' >/dev/null 2>&1 && exit 0; [[ $(hyprctl locked) != true ]] && kitty --class arch-screensaver --start-as fullscreen --override window_padding_width=0 --override background_opacity=1.0 --override dynamic_background_opacity=no -e "$HOME/.local/bin/arch-screensaver" --now
}

listener {
    timeout = 300
    on-timeout = [[ $(hyprctl locked) != true ]] && hyprlock; pkill -x ttfx; pkill -f "[a]rch-screensaver --now"
    on-resume = hyprctl dispatch dpms on
}

# Turn the display off (DPMS) shortly after the screen is locked, so the panel
# doesn't stay lit all night draining battery. Mouse/key motion wakes it
# (misc.mouse_move_enables_dpms / key_press_enables_dpms).
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
}