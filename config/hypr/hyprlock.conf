# ──────────────────────────────────────────────
#   Hyprlock — blurred screenshot + matugen colors
#   Colors come from hyprlock-colors.conf (matugen).
# ──────────────────────────────────────────────
source = ~/.config/hypr/hyprlock-colors.conf

# BACKGROUND — live blurred screenshot of the session
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $primary
    inner_color = rgba(100, 114, 125, 0.3)
    font_color = $on_surface
    check_color = $primary
    fail_color = $error
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Enter Pass
    hide_input = false
    position = 0, -225
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = $on_surface
    font_size = 130
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 240
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = $on_surface_variant
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
}

# Profile photo
image {
    monitor =
    path = ~/Personal/DOC/profile.jpeg
    border_color = $primary
    border_size = 2
    size = 140
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hi, $USER
    color = $on_surface_variant
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}
