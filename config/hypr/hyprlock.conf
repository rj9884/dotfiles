# ──────────────────────────────────────────────
#   Hyprlock Configuration
#   Theme: Omarchy (matches hypr/colors.conf)
# ──────────────────────────────────────────────
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(16, 21, 16, 1)
}

input-field {
    monitor =
    size = 260, 70
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(151, 213, 165, 1)
    inner_color = rgba(16, 21, 16, 0.85)
    font_color = rgba(255, 255, 255, 1)
    placeholder_text = <i>Password…</i>
    fail_text = <i>Wrong, try again</i>
    dots_size = 0.2
    dots_spacing = 0.1
    dots_center = true
    fade_on_empty = true
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big>$(date +'%H:%M')</big></b>"
    color = rgba(151, 213, 165, 1)
    font_size = 72
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 18
    position = 0, -95
    halign = center
    valign = center
}